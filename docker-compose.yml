services:
  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: fitops-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - fitops-network

  # Express Backend REST API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitops-backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/fitops
      - JWT_SECRET=fitops_secret_jwt_key_123
    depends_on:
      - mongodb
    networks:
      - fitops-network

  # React Frontend (Nginx static server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fitops-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - fitops-network

  # Nginx Gateway Reverse Proxy
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: fitops-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - fitops-network

  # Prometheus Telemetry Collector
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: fitops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - backend
    networks:
      - fitops-network

  # Grafana Visualizer Dashboard
  grafana:
    image: grafana/grafana:10.4.1
    container_name: fitops-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - fitops-network

volumes:
  mongodb_data:
  prometheus_data:
  grafana_data:

networks:
  fitops-network:
    driver: bridge
